<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Login | AI Agent Security Platform
    </title>

    <link
        rel="stylesheet"
        href="/frontend/style.css"
    >

</head>


<body class="login-page">


    <div class="login-container">

        <div class="login-card">


            <!-- LOGO -->

            <div class="login-logo">
                🛡️
            </div>


            <!-- TITLE -->

            <h1>
                AI Agent Security Platform
            </h1>


            <p class="login-subtitle">

                Secure access to the
                security testing dashboard

            </p>


            <!-- LOGIN FORM -->

            <form id="loginForm">


                <!-- USERNAME -->

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Enter username"
                        autocomplete="username"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>


                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter password"
                            autocomplete="current-password"
                            required
                        >


                        <button
                            type="button"
                            id="togglePassword"
                            class="password-toggle"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <!-- ERROR -->

                <div
                    id="loginError"
                    class="login-error hidden"
                ></div>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="login-button"
                >
                    LOGIN
                </button>


            </form>


            <!-- FOOTER -->

            <div class="login-footer">

                <span>
                    AI Security Testing Platform
                </span>

                <span>
                    v1.0.0
                </span>

            </div>


        </div>

    </div>


    <script src="/frontend/login.js"></script>

</body>

</html>
