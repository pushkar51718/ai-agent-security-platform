<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AI Agent Chat</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #0f172a;

            color: #f8fafc;

        }


        .container {

            width: 96%;

            max-width: 1700px;

            margin: 0 auto;

            padding: 28px 0 50px;

        }


        /* =================================================
           HEADER
           ================================================= */

        .header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 30px;

            gap: 20px;

        }


        .header-left h1 {

            margin: 0;

            font-size: 42px;

            font-weight: 700;

        }


        .header-left p {

            margin: 8px 0 0;

            color: #94a3b8;

            font-size: 20px;

        }


        .header-buttons {

            display: flex;

            gap: 12px;

        }


        button {

            border: none;

            cursor: pointer;

            font-size: 16px;

            font-weight: 700;

            border-radius: 10px;

            padding: 15px 24px;

            transition: 0.2s ease;

        }


        button:hover {

            transform: translateY(-1px);

            opacity: 0.92;

        }


        button:disabled {

            opacity: 0.55;

            cursor: not-allowed;

            transform: none;

        }


        .dashboard-button {

            background: #334155;

            color: white;

        }


        .logout-button {

            background: #ef4444;

            color: white;

        }


        .send-button {

            background: #2563eb;

            color: white;

            min-width: 140px;

        }


        /* =================================================
           CARD
           ================================================= */

        .card {

            background: #1e293b;

            border: 1px solid #334155;

            border-radius: 18px;

            padding: 30px;

            margin-bottom: 25px;

        }


        .card h2 {

            margin: 0;

            font-size: 32px;

        }


        .card-description {

            color: #94a3b8;

            margin-top: 8px;

            margin-bottom: 28px;

            font-size: 18px;

        }


        /* =================================================
           SELECT
           ================================================= */

        .label {

            display: block;

            margin-bottom: 10px;

            font-size: 18px;

            font-weight: 700;

        }


        select {

            width: 100%;

            padding: 17px 20px;

            border-radius: 10px;

            border: 1px solid #475569;

            background: #0f172a;

            color: white;

            font-size: 18px;

            outline: none;

        }


        select:focus {

            border-color: #2563eb;

        }


        /* =================================================
           CHAT BOX
           ================================================= */

        .chat-box {

            height: 560px;

            overflow-y: auto;

            background: #020617;

            border: 1px solid #334155;

            border-radius: 14px;

            padding: 30px;

            margin-top: 25px;

            display: flex;

            flex-direction: column;

            gap: 18px;

        }


        .message {

            max-width: 75%;

            padding: 16px 20px;

            border-radius: 12px;

            line-height: 1.5;

            word-wrap: break-word;

        }


        .agent-message {

            align-self: flex-start;

            background: #334155;

            color: white;

        }


        .user-message {

            align-self: flex-end;

            background: #2563eb;

            color: white;

        }


        .error-message {

            background: #7f1d1d;

        }


        .sender {

            font-weight: 700;

            font-size: 14px;

            color: #cbd5e1;

            margin-bottom: 7px;

        }


        .message-text {

            font-size: 18px;

        }


        /* =================================================
           STATUS
           ================================================= */

        .status {

            min-height: 25px;

            margin-top: 14px;

            color: #22c55e;

            font-size: 17px;

        }


        .status.error {

            color: #f87171;

        }


        /* =================================================
           INPUT AREA
           ================================================= */

        .input-area {

            display: flex;

            gap: 14px;

            margin-top: 18px;

        }


        #messageInput {

            flex: 1;

            min-width: 0;

            padding: 18px 20px;

            border-radius: 10px;

            border: 1px solid #2563eb;

            background: #0f172a;

            color: white;

            font-size: 18px;

            outline: none;

        }


        #messageInput::placeholder {

            color: #64748b;

        }


        #messageInput:focus {

            border-color: #60a5fa;

        }


        /* =================================================
           SELECTED AGENT
           ================================================= */

        .selected-agent {

            color: #22c55e;

            font-size: 18px;

            margin-top: 15px;

        }


        /* =================================================
           RESPONSIVE
           ================================================= */

        @media (max-width: 800px) {

            .header {

                flex-direction: column;

                align-items: flex-start;

            }


            .header-buttons {

                width: 100%;

            }


            .header-buttons button {

                flex: 1;

            }


            .input-area {

                flex-direction: column;

            }


            .send-button {

                width: 100%;

            }


            .message {

                max-width: 90%;

            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- =================================================
         HEADER
         ================================================= -->

    <div class="header">

        <div class="header-left">

            <h1>🤖 AI Agent Chat</h1>

            <p>
                Interact with the selected AI agent
            </p>

        </div>


        <div class="header-buttons">

            <button
                type="button"
                id="dashboardButton"
                class="dashboard-button"
            >
                Dashboard
            </button>


            <button
                type="button"
                id="logoutButton"
                class="logout-button"
            >
                Logout
            </button>

        </div>

    </div>


    <!-- =================================================
         CHAT CARD
         ================================================= -->

    <div class="card">

        <h2>
            AI Agent Chat
        </h2>


        <div class="card-description">

            Select an AI agent and interact with it securely.

        </div>


        <!-- =================================================
             AGENT SELECT
             ================================================= -->

        <label
            class="label"
            for="agentSelect"
        >
            Select Agent
        </label>


        <select
            id="agentSelect"
        >

            <option value="secure">
                Secure Customer Support Agent
            </option>

            <option value="vulnerable">
                Vulnerable Customer Support Agent
            </option>

        </select>


        <!-- =================================================
             CHAT MESSAGES
             ================================================= -->

        <div
            id="chatMessages"
            class="chat-box"
        >

            <div class="message agent-message">

                <div class="sender">
                    AI Agent
                </div>

                <div
                    id="welcomeMessage"
                    class="message-text"
                >
                    Hello! I am the Secure Customer
                    Support Agent. How can I help you today?
                </div>

            </div>

        </div>


        <!-- =================================================
             SELECTED AGENT STATUS
             ================================================= -->

        <div
            id="selectedAgentText"
            class="selected-agent"
        >
            Selected:
            Secure Customer Support Agent
        </div>


        <!-- =================================================
             RESPONSE STATUS
             ================================================= -->

        <div
            id="chatStatus"
            class="status"
        ></div>


        <!-- =================================================
             INPUT
             ================================================= -->

        <div class="input-area">

            <input
                type="text"
                id="messageInput"
                placeholder="Type your message..."
                autocomplete="off"
            >


            <button
                type="button"
                id="sendButton"
                class="send-button"
            >
                Send
            </button>

        </div>

    </div>

</div>


<script>


// =========================================================
// AUTHENTICATION
// =========================================================

const token =
    localStorage.getItem(
        "access_token"
    );


if (!token) {

    window.location.href = "/";

}


// =========================================================
// ELEMENTS
// =========================================================

const dashboardButton =
    document.getElementById(
        "dashboardButton"
    );


const logoutButton =
    document.getElementById(
        "logoutButton"
    );


const agentSelect =
    document.getElementById(
        "agentSelect"
    );


const chatMessages =
    document.getElementById(
        "chatMessages"
    );


const messageInput =
    document.getElementById(
        "messageInput"
    );


const sendButton =
    document.getElementById(
        "sendButton"
    );


const chatStatus =
    document.getElementById(
        "chatStatus"
    );


const selectedAgentText =
    document.getElementById(
        "selectedAgentText"
    );


const welcomeMessage =
    document.getElementById(
        "welcomeMessage"
    );


// =========================================================
// ESCAPE HTML
// =========================================================

function escapeHtml(value) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        value ?? "";

    return div.innerHTML;

}


// =========================================================
// GET AGENT NAME
// =========================================================

function getAgentName(type) {

    if (type === "vulnerable") {

        return "Vulnerable Customer Support Agent";

    }

    return "Secure Customer Support Agent";

}


// =========================================================
// UPDATE SELECTED AGENT
// =========================================================

function updateSelectedAgent() {

    const type =
        agentSelect.value;


    const name =
        getAgentName(type);


    selectedAgentText.textContent =
        `Selected: ${name}`;


    welcomeMessage.textContent =
        `Hello! I am the ${name}. How can I help you today?`;


    chatStatus.textContent = "";


    console.log(
        "SELECTED AGENT:",
        type
    );

}


// =========================================================
// AGENT CHANGE
// =========================================================

agentSelect.addEventListener(
    "change",
    function() {

        updateSelectedAgent();

    }
);


// =========================================================
// DASHBOARD BUTTON
// =========================================================

dashboardButton.addEventListener(
    "click",
    function() {

        console.log(
            "Dashboard button clicked"
        );


        window.location.href =
            "/dashboard";

    }
);


// =========================================================
// LOGOUT BUTTON
// =========================================================

logoutButton.addEventListener(
    "click",
    function() {

        console.log(
            "Logout button clicked"
        );


        localStorage.removeItem(
            "access_token"
        );

        localStorage.removeItem(
            "username"
        );

        localStorage.removeItem(
            "role"
        );


        window.location.href =
            "/";

    }
);


// =========================================================
// ADD MESSAGE
// =========================================================

function addMessage(
    sender,
    message,
    type
) {

    const messageElement =
        document.createElement(
            "div"
        );


    messageElement.className =
        `message ${type}`;


    messageElement.innerHTML = `

        <div class="sender">

            ${escapeHtml(sender)}

        </div>

        <div class="message-text">

            ${escapeHtml(message)}

        </div>

    `;


    chatMessages.appendChild(
        messageElement
    );


    chatMessages.scrollTop =
        chatMessages.scrollHeight;


    return messageElement;

}


// =========================================================
// SEND CHAT MESSAGE
// =========================================================

async function sendMessage() {

    const message =
        messageInput.value.trim();


    if (!message) {

        chatStatus.textContent =
            "Please enter a message.";

        chatStatus.className =
            "status error";

        messageInput.focus();

        return;

    }


    const agentType =
        agentSelect.value;


    const agentName =
        getAgentName(
            agentType
        );


    const currentToken =
        localStorage.getItem(
            "access_token"
        );


    if (!currentToken) {

        window.location.href =
            "/";

        return;

    }


    console.log(
        "Sending message"
    );


    console.log(
        "Agent type:",
        agentType
    );


    console.log(
        "Message:",
        message
    );


    // -----------------------------------------------------
    // SHOW USER MESSAGE
    // -----------------------------------------------------

    addMessage(
        "You",
        message,
        "user-message"
    );


    // -----------------------------------------------------
    // CLEAR INPUT
    // -----------------------------------------------------

    messageInput.value = "";


    // -----------------------------------------------------
    // DISABLE BUTTON
    // -----------------------------------------------------

    sendButton.disabled =
        true;


    messageInput.disabled =
        true;


    chatStatus.className =
        "status";


    chatStatus.textContent =
        `Sending to ${agentName}...`;


    // -----------------------------------------------------
    // SHOW THINKING
    // -----------------------------------------------------

    const thinking =
        addMessage(
            "AI Agent",
            "Thinking...",
            "agent-message"
        );


    try {

        // -------------------------------------------------
        // API REQUEST
        // -------------------------------------------------

        const response =
            await fetch(
                "/agent/chat",
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            `Bearer ${currentToken}`

                    },

                    body:
                        JSON.stringify({

                            message:
                                message,

                            agent_type:
                                agentType

                        })

                }
            );


        console.log(
            "CHAT STATUS:",
            response.status
        );


        // -------------------------------------------------
        // AUTH ERROR
        // -------------------------------------------------

        if (
            response.status === 401
        ) {

            localStorage.clear();

            window.location.href =
                "/";

            return;

        }


        // -------------------------------------------------
        // API ERROR
        // -------------------------------------------------

        if (!response.ok) {

            const errorData =
                await response
                    .json()
                    .catch(
                        () => null
                    );


            throw new Error(

                errorData?.detail ||
                `Chat request failed (${response.status})`

            );

        }


        // -------------------------------------------------
        // READ RESPONSE
        // -------------------------------------------------

        const data =
            await response.json();


        console.log(
            "CHAT RESPONSE:",
            data
        );


        // -------------------------------------------------
        // REMOVE THINKING
        // -------------------------------------------------

        if (thinking) {

            thinking.remove();

        }


        // -------------------------------------------------
        // AGENT RESPONSE
        // -------------------------------------------------

        const agentResponse =
            data.agent_response ||
            data.response ||
            "No response received.";


        const returnedAgent =
            data.agent ||
            agentName;


        addMessage(

            returnedAgent,

            agentResponse,

            "agent-message"

        );


        chatStatus.className =
            "status";


        chatStatus.textContent =
            "Response received.";


    }
    catch (error) {

        console.error(
            "CHAT ERROR:",
            error
        );


        if (thinking) {

            thinking.remove();

        }


        addMessage(

            "System",

            error.message,

            "agent-message error-message"

        );


        chatStatus.className =
            "status error";


        chatStatus.textContent =
            "Chat request failed.";

    }
    finally {

        sendButton.disabled =
            false;


        messageInput.disabled =
            false;


        messageInput.focus();

    }

}


// =========================================================
// SEND BUTTON
// =========================================================

sendButton.addEventListener(
    "click",
    function() {

        sendMessage();

    }
);


// =========================================================
// ENTER KEY
// =========================================================

messageInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


// =========================================================
// INITIAL STATE
// =========================================================

updateSelectedAgent();


messageInput.focus();


console.log(
    "AI Agent Chat initialized successfully."
);

</script>


</body>

</html>
